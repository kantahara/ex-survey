{% extends "layout.html" %}
{% block content %}
<div class="h2-container">
    <h2>STEP 1: タイトルの決定</h2>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <p class="text-center text-muted mb-5">まずはアンケートのタイトルを決めましょう。</p>
        
        <form method="post">
            <div class="mb-5">
                <label class="form-label fw-bold h4">アンケートのタイトル:</label>
                <input type="text" name="title" class="form-control form-control-lg p-3" required placeholder="例: 次回の社内イベントについて">
                <div class="form-text mt-2">わかりやすいタイトルを入力してください。</div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-brand btn-lg px-5 shadow">
                    次へ進む（質問の追加） <span class="ms-2">▶</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
